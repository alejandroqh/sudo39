[package]
name = "sudo39"
version = "0.1.0"
edition = "2024"
description = "MCP server exposing a guarded OS privilege-elevation tool (sudo, pkexec, macOS admin prompt, Windows UAC)"
license = "MIT"
repository = "https://github.com/anthropics/sudo39"
readme = "README.md"
keywords = ["mcp", "sudo", "elevation", "privilege", "osascript"]
categories = ["command-line-utilities", "os"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
turbomcp = "3.0.11"
