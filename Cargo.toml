[package]
name = "sudo39"
version = "1.0.0"
edition = "2024"
description = "Guarded privilege-elevation MCP server for AI agents (sudo, pkexec, macOS admin prompt, Windows UAC)"
license = "MIT"
authors = ["Alejandro Quintanar"]
repository = "https://github.com/alejandroqh/sudo39"
homepage = "https://github.com/alejandroqh/sudo39"
documentation = "https://github.com/alejandroqh/sudo39"
readme = "README.md"
keywords = ["mcp", "sudo", "elevation", "privilege", "osascript"]
categories = ["command-line-utilities", "os"]
exclude = [
    "dist/",
    "target/",
    ".claude-plugin/",
    "openclaw-plugin/",
    "CLAUDE.md",
    ".mcp.json",
    ".DS_Store",
]

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
turbomcp = "3.0.11"
